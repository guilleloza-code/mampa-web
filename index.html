<title>MAMPA | Consultoría Financiera y Gestión de Datos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:#2E3A46;
    background:#fff;
    line-height:1.7;
}

.hero{
    background:linear-gradient(135deg,#EAF3FD 0%,#ECF8F1 100%);
    text-align:center;
    padding:80px 20px;
}

.logo{
    width:320px;
    max-width:90%;
    margin-bottom:30px;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
}

.subtitle{
    max-width:800px;
    margin:auto;
    font-size:1.2rem;
    color:#4F5F70;
}

.btn{
    display:inline-block;
    margin-top:35px;
    background:#6FB98F;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    background:#56a377;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

.section-light{
    background:#F8FBFE;
}

h2{
    margin-bottom:25px;
    color:#4F86C6;
    border-left:5px solid #6FB98F;
    padding-left:15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    border-top:4px solid #6FB98F;
    box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

.card h3{
    margin-bottom:15px;
}

.partners-box{
    text-align:center;
    margin-top:30px;
}

.partners-btn{
    background:#4F86C6;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.partners-btn:hover{
    background:#3D71AE;
}

.partners-menu{
    display:none;
    margin-top:20px;
}

.partners-menu a{
    display:block;
    width:260px;
    margin:12px auto;
    padding:14px;
    text-decoration:none;
    color:#2E3A46;
    background:#E5F5EB;
    border-radius:10px;
    border:1px solid #CFE9DA;
    transition:0.3s;
}

.partners-menu a:hover{
    background:#D8F0E3;
}

.quote{
    background:#EAF6EF;
    text-align:center;
    padding:80px 20px;
}

.quote p{
    max-width:850px;
    margin:auto;
    font-size:1.3rem;
    font-style:italic;
}

footer{
    background:#F5F8FB;
    text-align:center;
    padding:50px 20px;
}

footer h3{
    color:#4F86C6;
    margin-bottom:10px;
}

@media(max-width:768px){

    h1{
        font-size:2.2rem;
    }

    .subtitle{
        font-size:1rem;
    }

}

</style>
</head>

<body>

<section class="hero">

<img src="LogoMampa.jpg" alt="MAMPA" class="logo">

<h1>Transformamos información en valor estratégico</h1>

<p class="subtitle">
Ayudamos a organizaciones a optimizar recursos, mejorar su rentabilidad y tomar decisiones basadas en datos.
</p>

</section>
